<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORUNEVA – Digitales Organisationsgedächtnis</title>
  <style>
    :root {
      --bg-color: #0d121f; /* Sehr dunkles Blau, wie im Bild */
      --node-bg: #111a2e; /* Dunklerer Knoten-Hintergrund */
      --node-border: #1e2d4a; /* Dezenter Rand */
      --node-text: #ffffff; /* Weißer Text */
      --cyan-active: #00f2fe; /* Cyan für aktive Verbindungen */
      --cyan-glow-intense: rgba(0, 242, 254, 0.7); /* Intensiverer Glow */
      --cyan-glow-subtle: rgba(0, 242, 254, 0.1);
      --focus-ring: #ffe600; /* High Contrast Fokus-Farbe */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--node-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Barrierefreiheits-Skip-Link */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--cyan-active);
      color: #000;
      padding: 8px;
      z-index: 100;
    }
    .skip-link:focus { top: 0; }

    /* SVG Canvas für Verbindungslinien */
    #svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .line-path {
      fill: none;
      stroke: var(--cyan-active);
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0; /* Standardmäßig unsichtbar */
      transition: opacity 0.4s ease, stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .line-path.active {
        opacity: 1;
    }

    /* Mind-Map Container */
    .mindmap-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* Pulsierendes Zentrum: Logo & Text */
    .center-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* WICHTIG: Struktur für Logo und Pulsier-Effekt */
    .center-visuals {
      position: relative;
      width: 140px; /* Durchmesser des Logos/Kreises */
      height: 140px;
      margin-bottom: 20px; /* Abstand zum Text darunter */
      display: flex;
