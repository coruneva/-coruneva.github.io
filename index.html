<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coruneva | Die Mitarbeitenden im Zentrum der Lösung</title>
    <link rel="icon" type="image/png" href="Favicon_Coruneva-transparent.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Hintergrund-Canvas für dynamische Verbindungslinien */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* Hauptlogo (Zentrum) */
        .core-logo-wrapper {
            position: absolute;
            cursor: pointer;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .core-logo-wrapper:hover {
            transform: scale(1.05);
        }

        .core-circle {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #111827 0%, #07090e 100%);
            border: 3px solid #00a8cc;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 168, 204, 0.25);
            margin: 0 auto 15px auto;
            position: relative;
            animation: pulse-glow 3s infinite alternate;
            padding: 20px;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(0, 168, 204, 0.2); border-color: #00a8cc; }
            100% { box-shadow: 0 0 45px rgba(16, 185, 129, 0.4); border-color: #10b981; }
        }

        .core-circle img {
            max-width: 130px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(0,168,204,0.3));
        }

        .click-hint {
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 1px;
            background: rgba(15, 23, 42, 0.9);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            display: inline-block;
        }

        /* Knotenpunkte (Sphären) Allgemein */
        .node {
            position: absolute;
            background: #111827;
            border: 2px solid #374151;
            color: #f8fafc;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
            white-space: nowrap;
        }

        .node.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .node:hover {
            background: #1f2937;
            border-color: #00a8cc;
            color: #00a8cc;
            box-shadow: 0 0 20px rgba(0, 168, 204, 0.4);
        }

        /* Modal / Detailfenster */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #111827;
            border: 1px solid #374151;
            border-left: 4px solid #00a8cc;
            width: 90%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.open .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ffffff;
        }

        .modal-body {
            color: #d1d5db;
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <!-- Zentrum: Echtes Coruneva Logo & Start-Hinweis -->
        <div class="core-logo-wrapper" id="core-logo" onclick="toggleFirstLevel()">
            <div class="core-circle">
                <img src="Logo_Coruneva-transparent.png" alt="Coruneva Logo">
            </div>
            <div class="click-hint">- Click to start your journey -</div>
        </div>

        <!-- 1. Stufe: Hauptmenü-Sphären -->
        <div class="node" id="node-ueber" style="top: 22%; left: 28%;" onclick="toggleSecondLevel('ueber')">Über uns</div>
        <div class="node" id="node-produkt" style="top: 22%; left: 62%;" onclick="openModal('Produkt', 'Hier entstehen demnächst Ihre Produkt-Sphären und Detaillierungen.')">Produkt</div>
        <div class="node" id="node-preise" style="top: 72%; left: 28%;" onclick="openModal('Preise', 'Hier folgen in Kürze die Tarifmodelle und Preiskategorien.')">Preise</div>
        <div class="node" id="node-kontakt" style="top: 72%; left: 62%;" onclick="toggleSecondLevel('kontakt')">Kontakt</div>
        <div class="node" id="node-faq" style="top: 48%; left: 82%;" onclick="openModal('FAQ', 'Hier finden Sie bald Antworten auf die am häufigsten gestellten Fragen zu Coruneva.')">FAQ</div>

        <!-- 2. Stufe: Unter-Sphären -->
        <!-- Unter 'Über uns' -->
        <div class="node sub-ueber" style="top: 8%; left: 15%;" onclick="openModal('Vision und Mission', 'Unsere Mission ist es, innovative Digitallösungen nahtlos und greifbar zu machen. Unsere Vision treibt uns an, Technologie mit menschlicher Interaktion in Einklang zu bringen.')">Vision und Mission</div>
        
        <!-- Unter 'Kontakt' -->
        <div class="node sub-kontakt" style="top: 86%; left: 55%;" onclick="openModal('Impressum', 'Angaben gemäß § 5 TMG:\nCorneva UG (haftungsbeschränkt)\nBeispielstraße 1\n12345 Musterstadt')">Impressum</div>
        <div class="node sub-kontakt" style="top: 86%; left: 78%;" onclick="openModal('Kontaktformular', 'Schreiben Sie uns direkt eine Nachricht an info@coruneva.de oder nutzen Sie unser integriertes Formular.')">Kontaktformular</div>
    </div>

    <!-- Modal Fenster -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Titel</h3>
                <button class="modal-close" onclick="closeModalDirect()">&times;</button>
            </div>
            <div class="modal-body" id="modalText">
                Inhalt...
            </div>
        </div>
    </div>

    <script>
        let isOpen = false;
        let activeSub = null;

        function toggleFirstLevel() {
            isOpen = !isOpen;
            const nodes = ['node-ueber', 'node-produkt', 'node-preise', 'node-kontakt', 'node-faq'];
            
            nodes.forEach(id => {
                const el = document.getElementById(id);
                if (isOpen) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                    closeAllSubs();
                }
            });
            drawLines();
        }

        function toggleSecondLevel(category) {
            closeAllSubs();

            if (activeSub === category) {
                activeSub = null;
                return;
            }

            activeSub = category;
            const subs = document.querySelectorAll('.sub-' + category);
            subs.forEach(el => el.classList.add('active'));
            drawLines();
        }

        function closeAllSubs() {
            document.querySelectorAll('[class*="sub-"]').forEach(el => {
                el.classList.remove('active');
            });
            activeSub = null;
            drawLines();
        }

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal(e) {
            if (e.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('open');
            }
        }

        function closeModalDirect() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        // Canvas Verbindungslinien dynamisch zeichnen
        function drawLines() {
            const canvas = document.getElementById('canvas-bg');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(0, 168, 204, 0.25)';
            ctx.lineWidth = 1.5;

            const core = document.getElementById('core-logo').getBoundingClientRect();
            const coreX = core.left + core.width / 2;
            const coreY = core.top + core.height / 2;

            const mainNodes = ['node-ueber', 'node-produkt', 'node-preise', 'node-kontakt', 'node-faq'];
            
            mainNodes.forEach(id => {
                const el = document.getElementById(id);
                if (el.classList.contains('active')) {
                    const rect = el.getBoundingClientRect();
                    const nodeX = rect.left + rect.width / 2;
                    const nodeY = rect.top + rect.height / 2;

                    ctx.beginPath();
                    ctx.moveTo(coreX, coreY);
                    ctx.lineTo(nodeX, nodeY);
                    ctx.stroke();
                }
            });

            // Linien zu Unterknoten
            const subNodes = document.querySelectorAll('[class*="sub-"]');
            subNodes.forEach(el => {
                if (el.classList.contains('active')) {
                    let parentId = '';
                    if (el.classList.contains('sub-ueber')) parentId = 'node-ueber';
                    if (el.classList.contains('sub-kontakt')) parentId = 'node-kontakt';

                    if (parentId) {
                        const parentEl = document.getElementById(parentId);
                        const pRect = parentEl.getBoundingClientRect();
                        const pX = pRect.left + pRect.width / 2;
                        const pY = pRect.top + pRect.height / 2;

                        const rect = el.getBoundingClientRect();
                        const nodeX = rect.left + rect.width / 2;
                        const nodeY = rect.top + rect.height / 2;

                        ctx.beginPath();
                        ctx.moveTo(pX, pY);
                        ctx.lineTo(nodeX, nodeY);
                        ctx.stroke();
                    }
                }
            });
        }

        window.addEventListener('resize', drawLines);
    </script>
</body>
</html>
