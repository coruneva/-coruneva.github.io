<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORUNEVA </title>
  <style>
    :root {
      --bg-color: #060a12;
      --node-bg: #0f172a;
      --node-border: #1e293b;
      --cyan-glow: #00f2fe;
      --green-glow: #00e676;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* SVG Canvas für Verbindungslinien */
    #svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .line-path {
      fill: none;
      stroke: url(#cyan-green-grad);
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .line-path.visible {
      opacity: 1;
    }

    /* Mind-Map Container */
    .mindmap-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* Zentrales Logo mit dem intensiven Aura-Glow aus dem Screenshot */
    .center-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      cursor: pointer;
      user-select: none;
    }

    .logo-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #090e17;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.35), 0 0 90px rgba(0, 230, 118, 0.2);
      animation: pulse-aura 3.5s infinite ease-in-out;
      border: 2px solid rgba(0, 242, 254, 0.4);
    }

    @keyframes pulse-aura {
      0%, 100% {
        box-shadow: 0 0 40px rgba(0, 242, 254, 0.3), 0 0 80px rgba(0, 230, 118, 0.15);
      }
      50% {
        box-shadow: 0 0 70px rgba(0, 242, 254, 0.6), 0 0 120px rgba(0, 230, 118, 0.35);
      }
    }

    .brand-title {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* Mind-Map Knotenpunkte (Standardmäßig unsichtbar bis Logo geklickt wird) */
    .node {
      position: absolute;
      background: var(--node-bg);
      border: 1px solid var(--node-border);
      color: var(--text-main);
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
    }

    .node.revealed {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .node:hover, .node.active {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    /* Unterpunkte (Subnodes) */
    .subnode {
      font-size: 13px;
      padding: 8px 18px;
    }

    /* Modal für Info-Texte */
    .modal {
      position: fixed;
      top: 30px;
      right: 30px;
      background: #0f172a;
      border: 1px solid var(--cyan-glow);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      border-radius: 12px;
      padding: 24px;
      max-width: 380px;
      width: 90%;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title { font-size: 18px; font-weight: 700; color: var(--cyan-glow); }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
    .modal-body { font-size: 14px; line-height: 1.6; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- SVG Overlay für Linien und Farbverläufe -->
  <svg id="svg-canvas">
    <defs>
      <linearGradient id="cyan-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f2fe"/>
        <stop offset="100%" stop-color="#00e676"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="mindmap-container" id="container">
    
    <!-- Zentrum: Logo & Titel -->
    <div class="center-node" id="center-node">
      <div class="logo-wrapper">
        <svg width="85" height="85" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 50 10 A 40 40 0 1 1 15 35" stroke="url(#cyan-green-grad)" stroke-width="10" stroke-linecap="round"/>
          <circle cx="50" cy="35" r="9" fill="none" stroke="#00f2fe" stroke-width="5"/>
          <circle cx="32" cy="65" r="9" fill="none" stroke="#00f2fe" stroke-width="5"/>
          <circle cx="68" cy="65" r="9" fill="none" stroke="#00e676" stroke-width="5"/>
          <path d="M 43 40 L 37 58 M 57 40 L 63 58 M 39 65 L 61 65" stroke="url(#cyan-green-grad)" stroke-width="4"/>
        </svg>
      </div>
      <h1 class="brand-title">CORUNEVA</h1>
      <p class="brand-subtitle">Klicke und erfahre mehr</p>
    </div>

    <!-- Hauptknoten (Anfangs unsichtbar) -->
    <div class="node main-node" id="node-uber-uns" style="top: 25%; left: 30%;">Über uns</div>
    <div class="node main-node" id="node-produkt" style="top: 25%; left: 70%;">Produkt</div>
    <div class="node main-node" id="node-faq" style="top: 50%; left: 80%;">FAQ</div>
    <div class="node main-node" id="node-kontakt" style="top: 75%; left: 70%;">Kontakt</div>
    <div class="node main-node" id="node-preise" style="top: 75%; left: 30%;">Preise</div>

    <!-- Unterpunkte -->
    <div class="node subnode" id="node-vision" style="top: 15%; left: 15%;">Vision</div>
    <div class="node subnode" id="node-mission" style="top: 35%; left: 15%;">Mission</div>
    <div class="node subnode" id="node-impressum" style="top: 85%; left: 60%;">Impressum</div>
    <div class="node subnode" id="node-kontaktformular" style="top: 85%; left: 80%;">Kontaktformular</div>

  </div>

  <!-- Modal -->
  <div class="modal" id="info-modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Titel</div>
      <button class="close-btn" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">Inhalt...</div>
  </div>

  <script>
    const svgCanvas = document.getElementById('svg-canvas');
    const centerNode = document.getElementById('center-node');
    const modal = document.getElementById('info-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalClose = document.getElementById('modal-close');

    let mainNodesRevealed = false;
    const activePaths = new Map(); // Speichert aktive Linien

    const contentData = {
      'node-vision': { title: 'Unsere Vision', text: 'Unternehmen ein lernendes Organisationsgedächtnis zu geben, das Strategie, Führung und Mitarbeiterbedürfnisse nahtlos vereint.' },
      'node-mission': { title: 'Unsere Mission', text: 'Wir befähigen Organisationen durch einen strukturierten 3-Schritte-Konsensprozess, echte Klarheit zu schaffen.' },
      'node-produkt': { title: 'Coruneva Produkt', text: 'Erfahre mehr über die 3 Ebenen von Coruneva: Von Befragungen bis zur strategischen Unternehmensanalyse.' },
      'node-preise': { title: 'Preise & Modelle', text: 'Flexibel auf Ihre Unternehmensgröße angepasst.' },
      'node-faq': { title: 'FAQ', text: 'Häufig gestellte Fragen zu Datenschutz und Ablauf.' },
      'node-impressum': { title: 'Impressum', text: 'Angaben gemäß § 5 TMG.' },
      'node-kontaktformular': { title: 'Kontakt', text: 'Schreiben Sie uns eine Nachricht.' }
    };

    function getCenterCoords(el) {
      const rect = el.getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    // Animierte Verbindungslinie zeichnen
    function drawLine(parentId, childId, key) {
      if (activePaths.has(key)) return;

      const parent = document.getElementById(parentId);
      const child = document.getElementById(childId);
      const p = getCenterCoords(parent);
      const c = getCenterCoords(child);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const dx = c.x - p.x;
      const dy = c.y - p.y;
      const d = `M ${p.x} ${p.y} C ${p.x + dx * 0.5} ${p.y}, ${p.x + dx * 0.5} ${c.y}, ${c.x} ${c.y}`;
      
      path.setAttribute('d', d);
      path.setAttribute('class', 'line-path');
      svgCanvas.appendChild(path);

      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.getBoundingClientRect();
      path.classList.add('visible');
      path.style.strokeDashoffset = '0';

      activePaths.set(key, path);
    }

    function removeLine(key) {
      if (activePaths.has(key)) {
        activePaths.get(key).remove();
        activePaths.delete(key);
      }
    }

    // 1. Schritt: Klick auf Logo lässt Hauptpunkte erscheinen
    centerNode.addEventListener('click', () => {
      if (!mainNodesRevealed) {
        mainNodesRevealed = true;
        document.querySelectorAll('.main-node').forEach(node => {
          node.classList.add('revealed');
        });
      }
      modal.classList.remove('open');
    });

    // 2. & 3. Schritt: Klick auf Hauptpunkte
    document.querySelectorAll('.main-node').forEach(node => {
      node.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = node.id;

        // Wenn ein anderer Hauptast geklickt wird -> Vorherigen Ast ("Über uns" inkl. Vision/Mission) komplett aufräumen
        if (id !== 'node-uber-uns') {
          removeLine('center-uber-uns');
          removeLine('uber-uns-vision');
          removeLine('uber-uns-mission');
          document.getElementById('node-uber-uns').classList.remove('active');
          document.getElementById('node-vision').classList.remove('revealed');
          document.getElementById('node-mission').classList.remove('revealed');
        }
        if (id !== 'node-kontakt') {
          removeLine('center-kontakt');
          removeLine('kontakt-impressum');
          removeLine('kontakt-formular');
          document.getElementById('node-kontakt').classList.remove('active');
          document.getElementById('node-impressum').classList.remove('revealed');
          document.getElementById('node-kontaktformular').classList.remove('revealed');
        }

        // Aktiven Zustand setzen
        document.querySelectorAll('.main-node').forEach(n => n.classList.remove('active'));
        node.classList.add('active');

        // Linie vom Logo zum Hauptpunkt zeichnen
        drawLine('center-node', id, `center-${id.replace('node-', '')}`);

        // Spezialfall "Über uns": Nach Erreichen der Linie Vision & Mission einblenden
        if (id === 'node-uber-uns') {
          setTimeout(() => {
            document.getElementById('node-vision').classList.add('revealed');
            document.getElementById('node-mission').classList.add('revealed');
          }, 400); // Nach Animationsende der Hauptlinie
        } else if (id === 'node-kontakt') {
          setTimeout(() => {
            document.getElementById('node-impressum').classList.add('revealed');
            document.getElementById('node-kontaktformular').classList.add('revealed');
          }, 400);
        } else {
          // Modal öffnen bei anderen Punkten
          if (contentData[id]) {
            modalTitle.innerText = contentData[id].title;
            modalBody.innerText = contentData[id].text;
            modal.classList.add('open');
          }
        }
      });
    });

    // 4. Schritt: Klick auf Unterpunkte (z.B. Vision)
    document.getElementById('node-vision').addEventListener('click', (e) => {
      e.stopPropagation();
      drawLine('node-uber-uns', 'node-vision', 'uber-uns-vision');
      modalTitle.innerText = contentData['node-vision'].title;
      modalBody.innerText = contentData['node-vision'].text;
      modal.classList.add('open');
    });

    document.getElementById('node-mission').addEventListener('click', (e) => {
      e.stopPropagation();
      drawLine('node-uber-uns', 'node-mission', 'uber-uns-mission');
      modalTitle.innerText = contentData['node-mission'].title;
      modalBody.innerText = contentData['node-mission'].text;
      modal.classList.add('open');
    });

    document.getElementById('node-impressum').addEventListener('click', (e) => {
      e.stopPropagation();
      drawLine('node-kontakt', 'node-impressum', 'kontakt-impressum');
      modalTitle.innerText = contentData['node-impressum'].title;
      modalBody.innerText = contentData['node-impressum'].text;
      modal.classList.add('open');
    });

    document.getElementById('node-kontaktformular').addEventListener('click', (e) => {
      e.stopPropagation();
      drawLine('node-kontakt', 'node-kontaktformular', 'kontakt-formular');
      modalTitle.innerText = contentData['node-kontaktformular'].title;
      modalBody.innerText = contentData['node-kontaktformular'].text;
      modal.classList.add('open');
    });

    modalClose.addEventListener('click', () => modal.classList.remove('open'));
  </script>
</body>
</html>
