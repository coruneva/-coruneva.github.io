<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORUNEVA – Digitales Organisationsgedächtnis</title>
  <style>
    :root {
      --bg-color: #0d121f; /* Sehr dunkles Blau, wie im Bild */
      --node-bg: #111a2e; /* Dunklerer Knoten-Hintergrund */
      --node-border: #1e2d4a; /* Dezenter Rand */
      --node-text: #ffffff; /* Weißer Text */
      --cyan-active: #00f2fe; /* Cyan für aktive Verbindungen */
      --cyan-glow-intense: rgba(0, 242, 254, 0.7); /* Intensiverer Glow */
      --cyan-glow-subtle: rgba(0, 242, 254, 0.1);
      --focus-ring: #ffe600; /* High Contrast Fokus-Farbe */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--node-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Barrierefreiheits-Skip-Link */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--cyan-active);
      color: #000;
      padding: 8px;
      z-index: 100;
    }
    .skip-link:focus { top: 0; }

    /* SVG Canvas für Verbindungslinien */
    #svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .line-path {
      fill: none;
      stroke: var(--cyan-active);
      stroke-width: 2.5;
      stroke-linecap: round;
      opacity: 0; /* Standardmäßig unsichtbar */
      transition: opacity 0.4s ease, stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .line-path.active {
        opacity: 1;
    }

    /* Mind-Map Container */
    .mindmap-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    /* Pulsierendes Zentrum: Logo & Text */
    .center-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* WICHTIG: Struktur für Logo und Pulsier-Effekt */
    .center-visuals {
      position: relative;
      width: 140px; /* Durchmesser des Logos/Kreises */
      height: 140px;
      margin-bottom: 20px; /* Abstand zum Text darunter */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      z-index: 2; /* Logo liegt ÜBER dem pulsierenden Kreis */
    }

    /* Der pulsierende Kreis - exakt wie im Soll-Bild */
    .pulsing-circle {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: none;
      border: 3px solid var(--cyan-active); /* Cyan-Rand */
      box-shadow: 0 0 30px var(--cyan-glow-intense); /* Intensiverer Glow */
      z-index: 1; /* Pulsierender Kreis liegt UNTER dem Logo */
      animation: pulse-ring 2.5s infinite ease-in-out;
    }

    @keyframes pulse-ring {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
        box-shadow: 0 0 30px var(--cyan-glow-intense);
      }
      50% {
        transform: scale(1.05); /* Nur leichtes Skalieren */
        opacity: 0.8; /* Leichtes Dimmen */
        box-shadow: 0 0 50px var(--cyan-glow-intense);
      }
    }

    /* WICHTIG: Animationen & Pulsieren abschalten bei reduzierter Bewegung */
    @media (prefers-reduced-motion: reduce) {
      .pulsing-circle {
        animation: none !important;
      }
      .line-path, .node, .subnode, .modal {
        transition: none !important;
      }
    }

    /* Zentrumstext */
    .center-text {
        text-align: center;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* Mind-Map Knotenpunkte (Standard) */
    .node {
      position: absolute;
      background: var(--node-bg);
      border: 1px solid var(--node-border);
      color: var(--node-text);
      padding: 10px 22px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      z-index: 5;
    }

    .node:hover {
      border-color: var(--cyan-active);
      box-shadow: 0 0 15px var(--cyan-glow-intense);
      transform: scale(1.05);
    }

    .node.active {
      border-color: var(--cyan-active);
      box-shadow: 0 0 20px var(--cyan-glow-intense);
      color: #ffffff;
    }

    /* Unterpunkte (Subnodes) */
    .subnode {
      font-size: 13px;
      padding: 8px 18px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
      transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s ease;
    }

    .subnode.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* Fokus-Indikator für Tastaturnavigation */
    .node:focus, .close-btn:focus, .skip-link:focus {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    /* Modal Dialog */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #111a2e;
      border: 1px solid var(--cyan-active);
      box-shadow: 0 0 30px var(--cyan-glow-intense);
      border-radius: 12px;
      padding: 24px;
      max-width: 450px;
      width: 90%;
      z-index: 100;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.open {
      display: block;
      opacity: 1;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title { font-size: 18px; font-weight: 700; color: var(--cyan-active); }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    .modal-body { font-size: 14px; line-height: 1.6; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Skip Link für Barrierefreiheit -->
  <a href="#center-node" class="skip-link">Zum Inhalt springen</a>

  <!-- SVG Canvas für Verbindungslinien -->
  <svg id="svg-canvas" aria-hidden="true"></svg>

  <!-- Mind-Map Ansicht -->
  <main class="mindmap-container" id="mindmap-view" aria-label="Interaktive Mind-Map Navigation">
    
    <!-- WICHTIG: Zentrumstext und Visuals getrennt für korrekte Positionierung -->
    <div class="center-node" id="center-node">
      <div class="center-visuals">
        <!-- Der pulsierende Ring -->
        <div class="pulsing-circle" aria-hidden="true"></div>
        <!-- Das Logo - exakt positioniert -->
        <img class="logo-img" src="Logo_Coruneva_Nocobase.png" alt="CORUNEVA Logo">
      </div>
      <div class="center-text">
        <h1 class="brand-title">CORUNEVA</h1>
        <p class="brand-subtitle">Klicke und erfahre mehr</p>
      </div>
    </div>

    <!-- Hauptknoten -->
    <div class="node" id="node-uber-uns" style="top: 25%; left: 30%;" tabindex="0" role="button" aria-expanded="false">Über uns</div>
    <div class="node" id="node-produkt" style="top: 25%; left: 70%;" tabindex="0" role="button">Produkt</div>
    <div class="node" id="node-faq" style="top: 50%; left: 80%;" tabindex="0" role="button">FAQ</div>
    <div class="node" id="node-kontakt" style="top: 75%; left: 70%;" tabindex="0" role="button" aria-expanded="false">Kontakt</div>
    <div class="node" id="node-preise" style="top: 75%; left: 30%;" tabindex="0" role="button">Preise</div>

    <!-- Unterknoten -->
    <div class="node subnode" id="node-vision" style="top: 15%; left: 20%;" tabindex="0" role="button">Vision</div>
    <div class="node subnode" id="node-mission" style="top: 35%; left: 15%;" tabindex="0" role="button">Mission</div>
    <div class="node subnode" id="node-impressum" style="top: 85%; left: 60%;" tabindex="0" role="button">Impressum</div>
    <div class="node subnode" id="node-kontaktformular" style="top: 85%; left: 80%;" tabindex="0" role="button">Kontaktformular</div>

  </main>

  <!-- Modal Dialog -->
  <div class="modal" id="info-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Titel</h2>
      <button class="close-btn" id="modal-close" aria-label="Fenster schließen">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">Inhalt...</div>
  </div>

  <script>
    const svgCanvas = document.getElementById('svg-canvas');
    const modal = document.getElementById('info-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const modalClose = document.getElementById('modal-close');

    // Zuordnung von Linien (Parent ID -> Child ID)
    const activeConnections = new Map();

    const contentData = {
      'node-vision': { title: 'Unsere Vision', text: 'Unsere Vision ist es, Unternehmen ein lernendes Organisationsgedächtnis zu geben, das Strategie, Führung und Mitarbeiterbedürfnisse nahtlos vereint.' },
      'node-mission': { title: 'Unsere Mission', text: 'Wir befähigen Organisationen durch einen strukturierten 3-Schritte-Konsensprozess, echte Klarheit zu schaffen und nachhaltige Entwicklung messbar zu machen.' },
      'node-produkt': { title: 'Coruneva Plattform', text: 'Erfahre mehr über die 3 Ebenen von Coruneva: Von der Befragung der Mitarbeitenden über das Teammatching bis hin zur strategischen Unternehmensanalyse.' },
      'node-preise': { title: 'Preise & Modelle', text: 'Flexibel auf Ihre Unternehmensgröße angepasst. Kontaktieren Sie uns für ein individuelles Angebot.' },
      'node-faq': { title: 'Häufige Fragen', text: 'Hier finden Sie Antworten zu Datenschutz (DSGVO), Integrationen und dem Ablauf von Konsensworkshops.' },
      'node-impressum': { title: 'Impressum', text: 'Angaben gemäß § 5 TMG. Coruneva GmbH...' },
      'node-kontaktformular': { title: 'Kontaktieren Sie uns', text: 'Schreiben Sie uns eine Nachricht, um eine Demo zu vereinbaren.' }
    };

    function getCenterCoords(element) {
      const rect = element.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    // Zeichnet eine geschwungene fließende Linie mit SVG Animation
    function drawAnimatedLine(parentId, childId) {
      const key = `${parentId}-${childId}`;
      if (activeConnections.has(key)) return;

      const parent = document.getElementById(parentId);
      const child = document.getElementById(childId);

      const pCoords = getCenterCoords(parent);
      const cCoords = getCenterCoords(child);

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      
      // Geschwungener Pfad (Bezier)
      const dx = cCoords.x - pCoords.x;
      const dy = cCoords.y - pCoords.y;
      const cx1 = pCoords.x + dx * 0.5;
      const cy1 = pCoords.y;
      const cx2 = pCoords.x + dx * 0.5;
      const cy2 = cCoords.y;

      const d = `M ${pCoords.x} ${pCoords.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${cCoords.x} ${cCoords.y}`;
      path.setAttribute('d', d);
      path.setAttribute('class', 'line-path');

      svgCanvas.appendChild(path);

      // Dash Animation für fließenden Aufbau
      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      
      // Trigger Redraw
      path.getBoundingClientRect();
      path.classList.add('active'); // opacity auf 1 setzen
      path.style.strokeDashoffset = '0';

      activeConnections.set(key, path);
    }

    // Event-Handling für Klicks
    document.querySelectorAll('.node').forEach(node => {
      node.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = node.id;

        // "Über uns" Klick -> Öffnet Vision & Mission
        if (id === 'node-uber-uns') {
          node.classList.toggle('active');
          drawAnimatedLine('center-node', 'node-uber-uns');
          
          const vis = document.getElementById('node-vision');
          const mis = document.getElementById('node-mission');
          
          vis.classList.toggle('visible');
          mis.classList.toggle('visible');

          if (vis.classList.contains('visible')) {
            setTimeout(() => drawAnimatedLine('node-uber-uns', 'node-vision'), 100);
            setTimeout(() => drawAnimatedLine('node-uber-uns', 'node-mission'), 200);
          }
          return;
        }

        // "Kontakt" Klick -> Öffnet Impressum & Formular
        if (id === 'node-kontakt') {
          node.classList.toggle('active');
          drawAnimatedLine('center-node', 'node-kontakt');
          
          const imp = document.getElementById('node-impressum');
          const form = document.getElementById('node-kontaktformular');
          
          imp.classList.toggle('visible');
          form.classList.toggle('visible');

          if (imp.classList.contains('visible')) {
            setTimeout(() => drawAnimatedLine('node-kontakt', 'node-impressum'), 100);
            setTimeout(() => drawAnimatedLine('node-kontakt', 'node-kontaktformular'), 200);
          }
          return;
        }

        // Für normale Knoten: Linie zeichnen & Modal öffnen
        const parentId = id.includes('vision') || id.includes('mission') ? 'node-uber-uns' : 
                         id.includes('impressum') || id.includes('formular') ? 'node-kontakt' : 'center-node';

        drawAnimatedLine(parentId, id);

        if (contentData[id]) {
          modalTitle.innerText = contentData[id].title;
          modalBody.innerText = contentData[id].text;
          modal.classList.add('open');
        }
      });

      // Tastatur-Bedienung unterstützen (Enter / Space auf Knoten)
      node.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          node.click();
        }
      });
    });

    modalClose.addEventListener('click', () => modal.classList.remove('open'));
    window.addEventListener('click', (e) => {
        if(e.target === modal || !modal.contains(e.target)){
            modal.classList.remove('open');
        }
    });

  </script>
</body>
</html>
